  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous photo">&#8249;</button>
    <img class="lb-img" id="lbImg" src="" alt="" />
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next photo">&#8250;</button>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const mosaic = document.getElementById('mosaic');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    let photos = [];
    let currentIndex = -1;

    function openLightbox(index) {
      currentIndex = index;
      lbImg.src = photos[currentIndex].url;
      lbImg.alt = photos[currentIndex].alt || '';
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function showRelative(delta) {
      currentIndex = (currentIndex + delta + photos.length) % photos.length;
      lbImg.src = photos[currentIndex].url;
      lbImg.alt = photos[currentIndex].alt || '';
    }

    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbPrev').addEventListener('click', () => showRelative(-1));
    document.getElementById('lbNext').addEventListener('click', () => showRelative(1));
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showRelative(-1);
      if (e.key === 'ArrowRight') showRelative(1);
    });

    // Real justified-row layout: pack photos into rows so each row's
    // items sum to exactly the container width, solving for that row's
    // HEIGHT (not fixing it) so it fits. Row height varying is what gives
    // visual rhythm even when every photo shares one aspect ratio (which
    // Jason's initial batch does — same camera, same 3:2 crop): a
    // fixed-row-height approach has nothing to vary in that case since
    // every tile ends up the same width too. This still can't leave a
    // gap — each row is solved to exactly fill the width by construction,
    // same guarantee as before, just computed instead of left to flexbox.
    const GAP = 8;

    function targetRowHeight(containerWidth) {
      if (containerWidth < 700) return 220;
      if (containerWidth < 1100) return 300;
      return 380;
    }

    function computeRows(items, containerWidth) {
      const target = targetRowHeight(containerWidth);
      const rows = [];
      let row = [];
      let ratioSum = 0;

      items.forEach((item) => {
        row.push(item);
        ratioSum += item.ratio;
        const widthAtTarget = ratioSum * target + (row.length - 1) * GAP;
        if (widthAtTarget >= containerWidth) {
          const availableWidth = containerWidth - (row.length - 1) * GAP;
          const height = availableWidth / ratioSum;
          // Cap how much a sparse last-in-a-run row can stretch beyond the
          // target height, so a row of one or two wide photos doesn't
          // blow up disproportionately tall.
          rows.push({ items: row, height: Math.min(height, target * 1.6) });
          row = [];
          ratioSum = 0;
        }
      });
      if (row.length > 0) {
        // Leftover partial row — don't force-stretch it to fill the width
        // (that's the standard justified-gallery convention), just use
        // the target height.
        rows.push({ items: row, height: target });
      }
      return rows;
    }

    function renderRows() {
      const containerWidth = mosaic.clientWidth;
      const rows = computeRows(photos, containerWidth);
      mosaic.innerHTML = '';

      let i = 0;
      rows.forEach((row) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'mosaic-row';
        rowEl.style.height = `${row.height}px`;

        row.items.forEach((item) => {
          const index = i++;
          const tile = document.createElement('button');
          tile.className = 'tile';
          tile.style.width = `${item.ratio * row.height}px`;
          tile.style.height = '100%';

          const img = document.createElement('img');
          img.src = item.url;
          img.alt = item.alt || '';
          img.loading = index < 6 ? 'eager' : 'lazy';

          tile.appendChild(img);
          tile.addEventListener('click', () => openLightbox(index));
          rowEl.appendChild(tile);
        });

        mosaic.appendChild(rowEl);
      });
    }

    // When a whole batch of photos shares one real aspect ratio (Jason's
    // camera always shoots 3:2, so his first 22 photos all do), the row
    // algorithm above still packs them mathematically correctly — it just
    // has nothing to vary, since every row solves to the same composition.
    // This nudges a repeating pattern of tiles toward a wider or narrower
    // *display* ratio, cropped via object-fit: cover — the same technique
    // real editorial mosaics use to mix "feature" and regular cells. It's
    // a deliberate, stable pattern (not randomized per page load), so the
    // layout doesn't jump around on refresh. Photos with genuinely varied
    // real aspect ratios (future uploads) will naturally look varied
    // without this — it's a fallback for a uniform batch, not a
    // replacement for real variety.
    const DISPLAY_RATIO_PATTERN = [1, 1, 1.65, 1, 0.7, 1, 1.3, 1, 1, 0.75, 1.5, 1];

    function loadDimensions(photo, index) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const realRatio = img.naturalWidth / img.naturalHeight || 1.5;
          const nudge = DISPLAY_RATIO_PATTERN[index % DISPLAY_RATIO_PATTERN.length];
          resolve({ ...photo, ratio: realRatio * nudge });
        };
        img.onerror = () => resolve({ ...photo, ratio: 1.5 });
        img.src = photo.url;
      });
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderRows, 150);
    });

    fetch('/api/photos/')
      .then((res) => res.json())
      .then((data) => Promise.all((data.photos || []).map(loadDimensions)))
      .then((withDimensions) => {
        photos = withDimensions;
        renderRows();
      })
      .catch(() => {
        mosaic.innerHTML = '<p class="admin-empty" style="padding: 2rem 6vw;">Couldn\'t load the gallery — try refreshing.</p>';
      });
  </script>
</body>
