<body class="inner-page">

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous photo">&#8249;</button>
    <img class="lb-img" id="lbImg" src="" alt="" />
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next photo">&#8250;</button>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const sectionsEl = document.getElementById('gallerySections');
    const jumpnavEl = document.getElementById('categoryJumpnav');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');

    // Must match PHOTO_CATEGORIES in lib/photoCategories.ts — this is the
    // order sections render in. A photo with category "" (not yet assigned
    // by the admin) is simply left off the public gallery until it is.
    const CATEGORIES = ['Landscape', 'Events', 'Aerial'];

    // { Landscape: [photo, ...], ... } — populated once photos load, each
    // photo carrying its resolved display `ratio`. The lightbox tracks
    // which category it's showing and cycles within just that list, since
    // "next" while browsing one section should stay in that section.
    let photosByCategory = {};
    let lightboxCategory = null;
    let currentIndex = -1;

    function openLightbox(category, index) {
      lightboxCategory = category;
      currentIndex = index;
      const item = photosByCategory[category][currentIndex];
      lbImg.src = item.url;
      lbImg.alt = item.alt || '';
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function showRelative(delta) {
      const list = photosByCategory[lightboxCategory];
      currentIndex = (currentIndex + delta + list.length) % list.length;
      lbImg.src = list[currentIndex].url;
      lbImg.alt = list[currentIndex].alt || '';
    }

    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbPrev').addEventListener('click', () => showRelative(-1));
    document.getElementById('lbNext').addEventListener('click', () => showRelative(1));
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showRelative(-1);
      if (e.key === 'ArrowRight') showRelative(1);
    });

    // Real justified-row layout: pack photos into rows so each row's
    // items sum to exactly the container width, solving for that row's
    // HEIGHT (not fixing it) so it fits. Row height varying is what gives
    // visual rhythm even when every photo shares one aspect ratio (which
    // Jason's initial batch does — same camera, same 3:2 crop): a
    // fixed-row-height approach has nothing to vary in that case since
    // every tile ends up the same width too. This still can't leave a
    // gap — each row is solved to exactly fill the width by construction,
    // same guarantee as before, just computed instead of left to flexbox.
    const GAP = 8;

    function targetRowHeight(containerWidth) {
      if (containerWidth < 700) return 220;
      if (containerWidth < 1100) return 300;
      return 380;
    }

    function computeRows(items, containerWidth) {
      const target = targetRowHeight(containerWidth);
      const rows = [];
      let row = [];
      let ratioSum = 0;

      items.forEach((item) => {
        row.push(item);
        ratioSum += item.ratio;
        const widthAtTarget = ratioSum * target + (row.length - 1) * GAP;
        if (widthAtTarget >= containerWidth) {
          const availableWidth = containerWidth - (row.length - 1) * GAP;
          const height = availableWidth / ratioSum;
          // Cap how much a sparse last-in-a-run row can stretch beyond the
          // target height, so a row of one or two wide photos doesn't
          // blow up disproportionately tall.
          rows.push({ items: row, height: Math.min(height, target * 1.6) });
          row = [];
          ratioSum = 0;
        }
      });
      if (row.length > 0) {
        // Leftover partial row — don't force-stretch it to fill the width
        // (that's the standard justified-gallery convention), just use
        // the target height.
        rows.push({ items: row, height: target });
      }
      return rows;
    }

    // Renders one category's own justified-row mosaic into its own
    // container. `eagerCount` only applies eager-loading to the very first
    // section's first few tiles -- every other section starts lazy, since
    // it's below the fold by construction (it's a whole section down).
    function renderRows(category, mosaicEl, eagerCount) {
      const containerWidth = mosaicEl.clientWidth;
      const items = photosByCategory[category];
      const rows = computeRows(items, containerWidth);
      mosaicEl.innerHTML = '';

      let i = 0;
      rows.forEach((row) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'mosaic-row';
        rowEl.style.height = `${row.height}px`;

        row.items.forEach((item) => {
          const index = i++;
          const tile = document.createElement('button');
          tile.className = 'tile';
          tile.style.width = `${item.ratio * row.height}px`;
          tile.style.height = '100%';

          const img = document.createElement('img');
          // Grid tiles render at well under 1200px wide even on the widest
          // row -- the thumbnail (max 1200px, WebP) instead of the full-res
          // original. Older rows uploaded before thumbnails existed fall
          // back to the original.
          img.src = item.thumbnailUrl || item.url;
          img.alt = item.alt || '';
          img.loading = index < eagerCount ? 'eager' : 'lazy';

          tile.appendChild(img);
          tile.addEventListener('click', () => openLightbox(category, index));
          rowEl.appendChild(tile);
        });

        mosaicEl.appendChild(rowEl);
      });
    }

    function renderAllSections() {
      CATEGORIES.forEach((category, sectionIndex) => {
        const mosaicEl = document.getElementById(`mosaic-${category}`);
        if (!mosaicEl) return;
        renderRows(category, mosaicEl, sectionIndex === 0 ? 6 : 0);
      });
    }

    // When a whole batch of photos shares one real aspect ratio (Jason's
    // camera always shoots 3:2, so his first 22 photos all do), the row
    // algorithm above still packs them mathematically correctly — it just
    // has nothing to vary, since every row solves to the same composition.
    // This nudges a repeating pattern of tiles toward a wider or narrower
    // *display* ratio, cropped via object-fit: cover — the same technique
    // real editorial mosaics use to mix "feature" and regular cells. It's
    // a deliberate, stable pattern (not randomized per page load), so the
    // layout doesn't jump around on refresh. Photos with genuinely varied
    // real aspect ratios (future uploads) will naturally look varied
    // without this — it's a fallback for a uniform batch, not a
    // replacement for real variety.
    const DISPLAY_RATIO_PATTERN = [1, 1, 1.65, 1, 0.7, 1, 1.3, 1, 1, 0.75, 1.5, 1];

    // Ratio comes straight from stored width/height — no network request
    // needed. Only photos uploaded before dimensions were captured (width/
    // height both 0) fall back to actually loading the image to measure it.
    function resolveRatio(photo, index) {
      const nudge = DISPLAY_RATIO_PATTERN[index % DISPLAY_RATIO_PATTERN.length];

      if (photo.width && photo.height) {
        return Promise.resolve({ ...photo, ratio: (photo.width / photo.height) * nudge });
      }

      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const realRatio = img.naturalWidth / img.naturalHeight || 1.5;
          resolve({ ...photo, ratio: realRatio * nudge });
        };
        img.onerror = () => resolve({ ...photo, ratio: 1.5 });
        img.src = photo.url;
      });
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderAllSections, 150);
    });

    // Builds the jump-nav pill + section shell (heading, count, empty
    // mosaic container) for each category that actually has photos, in
    // CATEGORIES order. A category with zero photos is skipped entirely
    // rather than shown empty.
    function buildSections() {
      jumpnavEl.innerHTML = '';
      sectionsEl.innerHTML = '';

      CATEGORIES.forEach((category) => {
        const items = photosByCategory[category];
        if (!items || items.length === 0) return;

        const link = document.createElement('a');
        link.href = `#${category}`;
        link.textContent = `${category} (${items.length})`;
        jumpnavEl.appendChild(link);

        const section = document.createElement('section');
        section.className = 'category-section';
        section.id = category;
        section.innerHTML = `
          <div class="category-head">
            <h2>${category}</h2>
            <span class="category-count">${items.length} photo${items.length === 1 ? '' : 's'}</span>
          </div>
          <div class="mosaic" id="mosaic-${category}"></div>
        `;
        sectionsEl.appendChild(section);
      });
    }

    fetch('/api/photos/')
      .then((res) => res.json())
      .then((data) => Promise.all((data.photos || []).map(resolveRatio)))
      .then((withRatios) => {
        photosByCategory = {};
        CATEGORIES.forEach((category) => { photosByCategory[category] = []; });
        // A photo with category "" hasn't been assigned a section by the
        // admin yet -- leave it off the public gallery until it is, rather
        // than showing a confusing "Uncategorized" heading to visitors.
        withRatios.forEach((photo) => {
          if (photosByCategory[photo.category]) {
            photosByCategory[photo.category].push(photo);
          }
        });

        buildSections();
        renderAllSections();

        if (Object.values(photosByCategory).every((list) => list.length === 0)) {
          sectionsEl.innerHTML = '<p class="admin-empty" style="padding: 2rem 6vw; text-align: center;">No photos yet — check back soon.</p>';
        }

        // A direct link like /gallery/#Events arrives before the section
        // exists (sections only get built once photos have loaded), so the
        // browser's native jump-to-hash has nothing to scroll to yet --
        // finish that jump ourselves now that the target exists.
        if (location.hash) {
          const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
          if (target) target.scrollIntoView();
        }
      })
      .catch(() => {
        sectionsEl.innerHTML = '<p class="admin-empty" style="padding: 2rem 6vw; text-align: center;">Couldn\'t load the gallery — try refreshing.</p>';
      });
  </script>
  <script src="/nav.js" defer></script>
</body>
